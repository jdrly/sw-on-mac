<!doctype html><html><head><style>
@font-face{font-family:U;src:url(unbounded.woff2) format("woff2");font-weight:200 900}
body{margin:0;background:#222;display:flex;gap:40px;padding:40px;flex-wrap:wrap}
.icon{width:512px;height:512px;position:relative;background:#05060a;overflow:hidden}
canvas{position:absolute;inset:0}
.sw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:U;font-weight:800;color:#eef1f6;letter-spacing:-0.04em}
</style></head><body>
<div class="icon" id="a"><canvas width="1024" height="1024" style="width:512px;height:512px"></canvas><svg viewBox="0 0 512 512" width="512" height="512" style="position:absolute;inset:0">
  <circle cx="256" cy="256" r="196" fill="none" stroke="#2c3345" stroke-width="2"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#1d2230" stroke-width="2"/>
  <rect x="171" y="171" width="170" height="170" fill="#05060a" stroke="#eef1f6" stroke-width="12"/>
  <rect x="207" y="203" width="98" height="47" fill="#ff3d2e"/>
  <rect x="207" y="262" width="98" height="47" fill="#2fd5ff"/>
</svg></div>
<div class="icon" id="b"><canvas width="1024" height="1024" style="width:512px;height:512px"></canvas>
  <div class="sw" style="font-size:172px;gap:0"><span style="display:flex;flex-direction:column;gap:10px;margin-right:16px"><i style="display:block;width:34px;height:44px;background:#ff3d2e"></i><i style="display:block;width:34px;height:44px;background:#2fd5ff"></i></span>SW</div></div>
<div class="icon" id="c"><canvas width="1024" height="1024" style="width:512px;height:512px"></canvas><svg viewBox="0 0 512 512" width="512" height="512" style="position:absolute;inset:0">
  <rect x="186" y="128" width="140" height="120" fill="#ff3d2e"/>
  <rect x="186" y="264" width="140" height="120" fill="#2fd5ff"/>
</svg></div>
<script>
function rng(s){return()=>((s=Math.imul(s^s>>>15,1|s)+(s^=s+Math.imul(s^s>>>7,61|s))^s>>>14)>>>0)/4294967296}
function warp(canvas, seed, cx, cy, n, inner, dim){
  const g=canvas.getContext('2d'), r=rng(seed); g.scale(2,2);
  const glow=g.createRadialGradient(cx,cy,0,cx,cy,300); glow.addColorStop(0,'rgba(47,213,255,0.16)'); glow.addColorStop(0.5,'rgba(255,61,46,0.05)'); glow.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=glow; g.fillRect(0,0,512,512);
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2, d0=inner+r()*200, len=20+r()*(d0*0.9), c=r();
    const col=c<0.12?'255,61,46':c<0.26?'47,213,255':'238,241,246';
    const x0=cx+Math.cos(a)*d0, y0=cy+Math.sin(a)*d0, x1=cx+Math.cos(a)*(d0+len), y1=cy+Math.sin(a)*(d0+len);
    const gr=g.createLinearGradient(x0,y0,x1,y1); gr.addColorStop(0,`rgba(${col},0)`); gr.addColorStop(1,`rgba(${col},${(0.35+r()*0.6)*dim})`);
    g.strokeStyle=gr; g.lineWidth=0.8+r()*2.2*(d0/260); g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
  }
}
warp(document.querySelector('#a canvas'),7,256,256,170,110,1);
warp(document.querySelector('#b canvas'),11,256,256,150,140,0.55);
warp(document.querySelector('#c canvas'),5,256,256,170,150,0.8);
</script></body></html>
